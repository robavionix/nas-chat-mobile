<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><link rel="apple-touch-icon" href="/apple-touch-icon.png"><meta name="theme-color" content="#e9edf1"><link rel="icon" type="image/png" href="./favicon.png?v=0.6.3"><title>聊天 · 电脑视图</title>
<style>
:root{--accent:#07c160;--accent-soft:#07c16044;--accent-tint:#07c16014;--accent-text:#0a7a43;--caret:#1aad19}
body[data-client=qq]{--accent:#0099ff;--accent-soft:#0099ff44;--accent-tint:#0099ff14;--accent-text:#0068b5;--caret:#0099ff}
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#e9edf1;color:#1f2d3a;font:14px/1.5 system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
#view{position:fixed;inset:0;width:100%;height:100%;cursor:default;outline:none;touch-action:none;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#bar{position:fixed;top:calc(8px + env(safe-area-inset-top));right:calc(10px + env(safe-area-inset-right));z-index:5;display:flex;align-items:center;gap:4px;padding:3px 4px 3px 10px;border-radius:999px;background:#ffffffe6;box-shadow:0 2px 10px #1f2d3a22;font-size:12px;color:#55697a;user-select:none}
#bar button{border:0;background:none;color:#2a6fb0;font:inherit;padding:4px 8px;border-radius:999px;cursor:pointer}#bar button:hover{background:#eaf2fa}
#dot{width:8px;height:8px;border-radius:50%;background:#c4ccd4;margin-right:4px}#dot.on{background:var(--accent)}
#draft{position:fixed;z-index:4;margin:0;padding:0;border:0;outline:none;resize:none;overflow-y:auto;background:#fafafa;color:#191919;font-family:"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",system-ui,sans-serif;line-height:1.5;caret-color:var(--caret);box-shadow:none;-webkit-appearance:none;appearance:none;transition:opacity .15s}
#draft[hidden]{display:none}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:9;max-width:min(560px,90vw);padding:8px 16px;border-radius:8px;background:#1f2d3ae6;color:#fff;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none}
#toast.visible{opacity:1}#toast.error{background:#a33a2ce6}
#waiting{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;color:#6b7c8a;font-size:15px;pointer-events:none}#waiting[hidden]{display:none}
#drop{position:fixed;inset:12px;z-index:8;display:none;align-items:center;justify-content:center;border:3px dashed var(--accent);border-radius:16px;background:var(--accent-tint);color:var(--accent-text);font-size:20px;pointer-events:none}
#drop.on{display:flex}
#popupbar{position:fixed;top:8px;left:50%;transform:translateX(-50%);z-index:7;display:flex;align-items:center;gap:10px;max-width:min(560px,70vw);padding:5px 6px 5px 14px;border-radius:999px;background:#1f2d3ae6;color:#fff;font-size:13px;box-shadow:0 2px 12px #1f2d3a44}
#popupbar[hidden]{display:none}#popupbar span{min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}#popupbar small{color:#b9c6d2;white-space:nowrap}
#popupbar button{border:0;border-radius:999px;padding:4px 14px;background:#fff;color:#1f2d3a;font:inherit;font-weight:600;cursor:pointer}
#sheet{position:fixed;inset:0;z-index:10;display:none;align-items:center;justify-content:center;background:#0b1b2655}#sheet.open{display:flex}
#sheet .panel{width:min(440px,92vw);max-height:84vh;overflow:auto;background:#fff;border-radius:12px;padding:18px 20px;box-shadow:0 20px 60px #0b1b2644}
#sheet h2{font-size:16px;margin:0 0 4px}#sheet p{margin:0 0 10px;color:#6c8292;font-size:12px}
#sheet canvas{display:block;width:100%;border:1px solid #e6ebef;border-radius:8px;margin-bottom:10px}
#sheet ul{list-style:none;margin:0 0 14px;padding:0;display:grid;gap:4px;font-size:13px}#sheet li{overflow-wrap:anywhere}
#sheet .actions{display:flex;justify-content:flex-end;gap:8px}
#sheet button{border:1px solid #e1e4e8;background:#f5f6f7;border-radius:6px;padding:6px 16px;font:inherit;cursor:pointer}#sheet button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.ripple{position:fixed;z-index:6;width:28px;height:28px;margin:-14px 0 0 -14px;border-radius:50%;background:var(--accent-soft);pointer-events:none;animation:ripple .35s ease-out forwards}
@keyframes ripple{from{transform:scale(.4);opacity:1}to{transform:scale(1.4);opacity:0}}
@media (pointer:coarse){#bar{font-size:13px}#bar button{padding:8px 12px;font-size:14px}#popupbar button{padding:8px 18px}}
</style></head><body>
<canvas id="view" tabindex="0" aria-label="聊天画面"></canvas>
<div id="waiting">正在连接…</div>
<div id="bar"><span id="dot"></span><span id="status">电脑视图</span><button id="lan-pref" title="在家时画面直接从 NAS 传输（需信任 NAS 证书）"></button><button id="attach" title="发送图片或文件到当前聊天">发送文件</button><button id="to-phone" title="切换到手机界面">手机视图</button><button id="logout">退出</button></div>
<textarea id="draft" hidden aria-label="输入消息" autocomplete="off" spellcheck="false"></textarea>
<input id="picker" type="file" multiple hidden>
<div id="popupbar" hidden><span id="popup-name"></span><small>Esc</small><button id="popup-close">关闭</button></div>
<div id="drop">松开即可发送到当前聊天</div>
<div id="sheet"><div class="panel"><h2>发送到这个聊天</h2><p>请核对下面的聊天对象</p><canvas aria-label="当前聊天"></canvas><ul></ul><div class="actions"><button id="upload-cancel">取消</button><button id="upload" class="primary">发送</button></div></div></div>
<div id="toast" role="status" aria-live="polite"></div>
<script src="./lan.js?v=0.6.3"></script><script src="./desktop.js?v=0.6.3"></script>
</body></html>
