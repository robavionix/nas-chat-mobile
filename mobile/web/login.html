<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="application-version" content="0.5.3"><meta name="theme-color" content="#f6f8fa"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="聊天"><link rel="manifest" href="/mobile/manifest.json"><link rel="apple-touch-icon" sizes="180x180" href="/mobile/apple-touch-icon.png?v=0.5.3"><link rel="icon" type="image/png" href="/mobile/favicon.png?v=0.5.3"><title>登录手机视图</title><style>*{box-sizing:border-box}body{margin:0;font:16px system-ui,-apple-system,sans-serif;color:#203044;background:#f6f8fa;min-height:100dvh;display:grid;place-items:center;padding:24px}.card{width:min(100%,380px)}.icon{width:64px;height:64px;border-radius:20px;background:#087dce;color:white;display:grid;place-items:center;font-size:30px;margin-bottom:28px}h1{font-size:28px;margin:0 0 12px}p{color:#687a8c;line-height:1.6;font-size:14px;margin:0 0 28px}label{font-size:14px;font-weight:600;display:block;margin-bottom:9px}input{font:inherit;width:100%;border:1px solid #cdd7df;border-radius:12px;padding:15px;background:white;outline:none}input:focus{border-color:#168bdd;box-shadow:0 0 0 3px #168bdd20}button{width:100%;padding:15px;border:0;border-radius:12px;color:white;background:#087dce;font:600 16px system-ui;margin-top:18px;min-height:50px}button:disabled{opacity:.55}small{display:block;color:#6b7e90;font-size:12px;line-height:1.7;margin-top:20px}#status{min-height:22px;color:#a33628;font-size:14px;margin-top:14px}</style></head><body><main class="card"><div class="icon">✉</div><h1>登录手机视图</h1><p>这台手机登录一次，保持 30 天。<br>使用远程桌面的网页密码（PASSWORD）。</p><form id="login"><input name="username" value="wechat" autocomplete="username" readonly style="position:absolute;left:-10000px" tabindex="-1" aria-label="用户名"><label for="password">网页密码</label><input id="password" name="password" type="password" autocomplete="current-password" required placeholder="输入已有的网页密码"><button id="submit" type="submit">登录并记住这台手机</button><div id="status" role="status" aria-live="polite"></div></form><small>登录状态仅保存在这台设备的浏览器中。<br>在共用设备上使用后，请在页面里退出登录。</small></main><script>const form=document.querySelector('#login'),button=document.querySelector('#submit'),status=document.querySelector('#status');form.onsubmit=async e=>{e.preventDefault();button.disabled=true;status.textContent='';try{const r=await fetch('/session/login',{method:'POST',headers:{'Content-Type':'application/json','X-Mobile-Control':'1'},body:JSON.stringify({password:document.querySelector('#password').value})});const value=await r.json();if(!r.ok)throw Error(value.error||'登录失败');location.replace('/mobile/')}catch(e){status.textContent=e.message;button.disabled=false}};fetch('/mobile-api/health',{cache:'no-store'}).then(async r=>{if(r.ok&&(r.headers.get('content-type')||'').includes('application/json')&&(await r.json()).ok)location.replace('/mobile/')}).catch(()=>{});</script></body></html>
