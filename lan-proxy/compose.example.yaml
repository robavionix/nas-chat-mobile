name: nas-chat-mobile-lan

services:
  lan:
    image: nginx:alpine
    container_name: nas-chat-mobile-lan
    network_mode: host
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./tls:/etc/nginx/tls:ro
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
